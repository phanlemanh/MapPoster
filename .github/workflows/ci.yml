name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Typecheck BOTH projects — mcp-server/ has its own tsconfig, and scripts/
      # only recently entered its include (a drift there shipped a runtime crash).
      - name: Typecheck
        run: |
          npx tsc -b
          npx tsc -p mcp-server/tsconfig.json

      - name: Unit + integration (Vitest)
        run: npm test

      # These three are the ones that were NOT in CI and caught the real defects:
      # the readyRef race (r6), the config-in-URL 16 KB cap (r9), the discarded
      # camera (r10). A public repo without them would merge those back in.
      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: MCP render integration
        run: npm run test:mcp

  gate:
    runs-on: ubuntu-latest
    env:
      # Kit acceptance-gate ghim sha (kit GUIDE §5.3 «Đường mặc định»): cổng chạy từ
      # MỘT bản kit, không chép tệp kit vào kho. Nâng kit = đổi DÒNG NÀY bằng PR có
      # chủ đích mỗi mốc — không auto-follow (kit §7.1).
      KIT_SHA: 9d1ae5271c947d206dbc418b34089e09b68f106b  # v2.24.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Lấy kit về NGOÀI cây kho, để `_acceptance/` của kit không bị quét lẫn với hồ
      # sơ của kho. Mọi bộ đọc của cổng tìm `lib/` cạnh chính nó.
      - name: Lấy kit acceptance-gate ở sha ghim
        run: |
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 https://github.com/phanlemanh/acceptance-gate-kit "$KIT_SHA"
          git -C "$RUNNER_TEMP/kit" checkout -q FETCH_HEAD
          echo "CLAUDE_PLUGIN_ROOT=$RUNNER_TEMP/kit" >> "$GITHUB_ENV"
      - name: Acceptance gate
        run: bash "$CLAUDE_PLUGIN_ROOT/scripts/pre-merge-check.sh" . --base "origin/${{ github.base_ref || 'main' }}"
      # Lint đấu dây bộ phép đo — hỏi thứ cổng không hỏi: lệnh của một phép đo
      # có thật sự chạm tiêu chí nó khai không. Chặn ở L0/L1/L2 (tiêu chí không
      # có phép đo, lệnh trỏ tệp không tồn tại, bộ đọc của chính lint hỏng);
      # L3 chỉ cảnh báo vì nó đoán bằng từ vựng. Xem đầu file script.
      - name: Lint đấu dây phép đo
        run: node _acceptance/eval-wiring-lint.mjs
