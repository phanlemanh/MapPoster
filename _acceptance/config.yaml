# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
recheck: strict              # CI re-check of COMMITTED evidence
baseline_minutes: []
executors:
  test:
    api: "npm test"
    e2e: "npm run test:e2e"
    mcp: "npm run test:mcp"
    mcp_protocol: "MCP_INTEGRATION=1 npx vitest run mcp-server/src/mcpProtocol.test.ts"
    motion_invariants: "npx vitest run src/render/motionScript.test.ts"
    motion_math: "npx vitest run src/render/motionMath.test.ts"
    motion_compiler: "npx vitest run mcp-server/src/motionCompiler.test.ts"
    # Vòng đời slot clip nằm ở HAI tệp: lối lấy/nhả ở motionCompiler, còn nhánh
    # xuống-cấp (encoder ngã) chỉ với tới được từ jobRunner. Một lane đơn lẻ
    # không chấm nổi AC-10, nên E13 chạy cả hai.
    clip_slot_lifecycle: "npx vitest run mcp-server/src/motionCompiler.test.ts mcp-server/src/jobRunner.test.ts"
    clip_http: "npx vitest run mcp-server/src/http.test.ts"
    # AC-12 có HAI nửa ở HAI tệp, đúng kiểu clip_slot_lifecycle ở trên: nửa
    # "429 thay vì xếp hàng vô hạn" nằm ở http.test.ts, còn nửa "/render thường
    # KHÔNG bị treo sau lưng clip" là deadline của pool.acquire — không một
    # chuỗi `acquire`/`deadline` nào tồn tại trong http.test.ts. E15 chạy cả hai
    # thay vì để nửa sau không có khẳng định nào trong lane của chính nó.
    clip_backpressure: "npx vitest run mcp-server/src/http.test.ts mcp-server/src/browserPool.test.ts"
    clip_tools: "npx vitest run mcp-server/src/tools.test.ts"
    text_free: "npx vitest run src/lib/export.test.ts src/lib/mapStyle.test.ts"
    basemap: "npx vitest run src/lib/basemap.test.ts"
    job_store: npx vitest run mcp-server/src/jobStore.test.ts
    job_runner: npx vitest run mcp-server/src/jobRunner.test.ts
    job_http: npx vitest run mcp-server/src/http.test.ts
    browser_suites: npm run test:e2e && npm run test:mcp
    resolve_config: npx vitest run mcp-server/src/resolveConfig.test.ts
    geocode: npx vitest run mcp-server/src/geocode.test.ts
    geometry: npx vitest run mcp-server/src/geometry.test.ts
    apply_render_config: npx vitest run src/render/applyRenderConfig.test.ts
    encode_animation: npx vitest run mcp-server/src/encodeAnimation.test.ts
    route: npx vitest run mcp-server/src/route.test.ts
    anchors: npx vitest run src/render/anchors.test.ts
    render_frame: npx vitest run mcp-server/src/renderFrame.test.ts
  script:
    compiler_domain_sweep: "npx tsx _acceptance/map-motion-clip/scripts/compiler-domain-sweep.ts"
    tier0_invariants: "npx tsx _acceptance/tier0-agent-params/scripts/tier0-invariants.ts"
    routes_invariants: "npx tsx _acceptance/routes-measurements/scripts/routes-invariants.ts"
    routes_demo: "npx tsx _acceptance/routes-measurements/scripts/demo-routes.ts"
    motion_tools_invariants: "npx tsx _acceptance/motion-tools-cost/scripts/motion-tools-invariants.ts"
    routing_invariants: "npx tsx _acceptance/road-routing/scripts/routing-invariants.ts"
    auth_invariants: "npx tsx _acceptance/mcp-auth/scripts/auth-invariants.ts"
    anchors_invariants: "npx tsx _acceptance/anchors-camera/scripts/anchors-invariants.ts"
    input_caps_negctrl: "bash _acceptance/input-caps/negctrl/run-negctrl.sh"
    basemap_invariants: "npx tsx _acceptance/satellite-basemap/scripts/basemap-invariants.ts"
    recipe_t3_untouched: "npx tsx _acceptance/recipe-region-spotlight/scripts/t3-untouched.ts"
  design:
    # PORTABLE $HOME + glob + `sort -V | tail -1`: hardcode home dir và ghim version
    # thì executor im lặng BLOCKED trên mọi máy khác (đường cũ /Users/manhphan/...1.11.2
    # KHÔNG tồn tại trên máy này — 2 executor chết câm suốt). Glob tự trỏ bản kit mới nhất.
    gate: "node $(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-gate.mjs | sort -V | tail -1)"
    # ui_check = asset browser-inject, KHÔNG prefix `node`.
    ui_check: "$(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-scan.js | sort -V | tail -1)"
risk_tiers:
  t1_skip_globs:
    - "**/*.md"
    - "*.md"
    - "_acceptance/**"
    - ".github/**"
    # Bộ gate vendored (đường dẫn CHÍNH XÁC, KHÔNG phải glob): nâng chính cái thước
    # không được làm hết hạn evidence đã ghim verified_commit — thước đo ≠ product code.
    - "scripts/pre-merge-check.sh"
    # Kit 2.0.0 đổi hậu tố .js → .cjs (CommonJS khoá bằng tên file, không phụ
    # thuộc "type" trong package.json của repo tiêu thụ) và thêm 3 lib.
    - "scripts/recheck-evidence.cjs"
    - "lib/evidence-core.cjs"
    - "lib/gap-probe.cjs"
    - "lib/workspace-record.cjs"
    - "lib/ac-line.cjs"
    - "lib/md-section.cjs"
    # GIỮ tên CŨ: hồ sơ đã ký trước 2.0.0 ghim verified_commit ở thời điểm các
    # tên này còn sống. Bỏ dòng cũ đi thì một lần đổi tên thuần tuý của THƯỚC ĐO
    # sẽ làm hết hạn bằng chứng của SẢN PHẨM.
    - "scripts/recheck-evidence.js"
    - "lib/evidence-core.js"
    - "lib/gap-probe.js"
    # lib/package.json: vá {"type":"commonjs"} của bộ gate cũ, 2.0.0 gỡ vì hậu
    # tố .cjs làm thay. Nó thuộc THƯỚC ĐO, nên chính lần XOÁ nó cũng không được
    # làm hết hạn bằng chứng — đo được: thiếu dòng này, một lần chạy không
    # --base cho 9/9 hồ sơ stale, đúng vết f557763.
    - "lib/package.json"
  t3_paths:
    - "src/lib/export.ts"
    - "src/lib/mapStyle.ts"
signoff:
  required_for: [T2, T3]
  approvers: ["manh"]
  # require_human_commit ĐÃ GỠ 17/08 (kit 2.1.0, ADR 0012): chữ ký là quyết định
  # người phát ngôn, máy ghi hộ và commit một lượt; trách nhiệm đọc ở forge
  # (người approve / bấm merge PR).
dev_server:
  start: "npm run dev"
  url: "http://localhost:5173"
feature_loop:
  # e2e và mcp GỘP thành một lệnh nối tiếp (browser_suites), không tách hai key
  # nữa: cả hai đều khởi động Chromium thật, mà vòng nghiệm thu chạy các lệnh
  # SONG SONG. Ngày 2026-08-05 điều đó làm test:mcp đỏ vì page.waitForFunction
  # quá trần chờ 20s — bộ đo mất 59,7s trong lúc nghiệm thu so với 41-44s khi
  # chạy riêng. Độ phủ không đổi, chỉ thôi để hai bộ giành trình duyệt của nhau.
  suite_keys: [executors.test.api, executors.test.browser_suites]
