# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
recheck: strict              # CI re-check of COMMITTED evidence
baseline_minutes: []
executors:
  test:
    api: "npm test"
    e2e: "npm run test:e2e"
    mcp: "npm run test:mcp"
  design:
    gate: "node /Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/1.11.2/scripts/design-gate.mjs"
    ui_check: "/Users/manhphan/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/1.11.2/scripts/design-scan.js"
risk_tiers:
  t1_skip_globs:
    - "**/*.md"
    - "_acceptance/**"
  t3_paths:
    - "src/lib/export.ts"
    - "src/lib/mapStyle.ts"
signoff:
  required_for: [T2, T3]
  approvers: ["manh"]
  require_human_commit: true
dev_server:
  start: "npm run dev"
  url: "http://localhost:5173"
feature_loop:
  suite_keys: [executors.test.api, executors.test.e2e, executors.test.mcp]
