# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
recheck: strict              # CI re-check of COMMITTED evidence
baseline_minutes: []
executors:
  test:
    api: "npm test"
    e2e: "npm run test:e2e"
    mcp: "npm run test:mcp"
    motion_invariants: "npx vitest run src/render/motionScript.test.ts"
    motion_math: "npx vitest run src/render/motionMath.test.ts"
    motion_compiler: "npx vitest run mcp-server/src/motionCompiler.test.ts"
    clip_http: "npx vitest run mcp-server/src/http.test.ts"
    clip_tools: "npx vitest run mcp-server/src/tools.test.ts"
    text_free: "npx vitest run src/lib/export.test.ts src/lib/mapStyle.test.ts"
    job_store: npx vitest run mcp-server/src/jobStore.test.ts
    job_runner: npx vitest run mcp-server/src/jobRunner.test.ts
    job_http: npx vitest run mcp-server/src/http.test.ts
    browser_suites: npm run test:e2e && npm run test:mcp
    resolve_config: npx vitest run mcp-server/src/resolveConfig.test.ts
    geocode: npx vitest run mcp-server/src/geocode.test.ts
    geometry: npx vitest run mcp-server/src/geometry.test.ts
    apply_render_config: npx vitest run src/render/applyRenderConfig.test.ts
    encode_animation: npx vitest run mcp-server/src/encodeAnimation.test.ts
    route: npx vitest run mcp-server/src/route.test.ts
  script:
    compiler_domain_sweep: "npx tsx _acceptance/map-motion-clip/scripts/compiler-domain-sweep.ts"
    tier0_invariants: "npx tsx _acceptance/tier0-agent-params/scripts/tier0-invariants.ts"
    routes_invariants: "npx tsx _acceptance/routes-measurements/scripts/routes-invariants.ts"
    routes_demo: "npx tsx _acceptance/routes-measurements/scripts/demo-routes.ts"
    motion_tools_invariants: "npx tsx _acceptance/motion-tools-cost/scripts/motion-tools-invariants.ts"
    routing_invariants: "npx tsx _acceptance/road-routing/scripts/routing-invariants.ts"
  design:
    gate: "node /Users/manh-macmini/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/1.31.0/scripts/design-gate.mjs"
    ui_check: "/Users/manh-macmini/.claude/plugins/cache/acceptance-gate-kit/acceptance-gate/1.31.0/scripts/design-scan.js"
risk_tiers:
  t1_skip_globs:
    - "**/*.md"
    - "*.md"
    - "_acceptance/**"
    - ".github/**"
  t3_paths:
    - "src/lib/export.ts"
    - "src/lib/mapStyle.ts"
signoff:
  required_for: [T2, T3]
  approvers: ["manh"]
  require_human_commit: true
dev_server:
  start: "npm run dev"
  url: "http://localhost:5173"
feature_loop:
  # e2e và mcp GỘP thành một lệnh nối tiếp (browser_suites), không tách hai key
  # nữa: cả hai đều khởi động Chromium thật, mà vòng nghiệm thu chạy các lệnh
  # SONG SONG. Ngày 2026-08-05 điều đó làm test:mcp đỏ vì page.waitForFunction
  # quá trần chờ 20s — bộ đo mất 59,7s trong lúc nghiệm thu so với 41-44s khi
  # chạy riêng. Độ phủ không đổi, chỉ thôi để hai bộ giành trình duyệt của nhau.
  suite_keys: [executors.test.api, executors.test.browser_suites]
