# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
recheck: strict              # CI re-check of COMMITTED evidence
baseline_minutes: []
executors:
  test:
    api: "npm test"
    e2e: "npm run test:e2e"
    mcp: "npm run test:mcp"
  design:
    # PORTABLE $HOME + glob + `sort -V | tail -1`: hardcode home dir và ghim version
    # thì executor im lặng BLOCKED trên mọi máy khác (đường cũ /Users/manhphan/...1.11.2
    # KHÔNG tồn tại trên máy này — 2 executor chết câm suốt). Glob tự trỏ bản kit mới nhất.
    gate: "node $(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-gate.mjs | sort -V | tail -1)"
    # ui_check = asset browser-inject, KHÔNG prefix `node`.
    ui_check: "$(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-scan.js | sort -V | tail -1)"
risk_tiers:
  t1_skip_globs:
    - "**/*.md"
    - "_acceptance/**"
    - ".github/**"
    # Bộ gate vendored (đường dẫn CHÍNH XÁC, KHÔNG phải glob): nâng chính cái thước
    # không được làm hết hạn evidence đã ghim verified_commit — thước đo ≠ product code.
    - "scripts/pre-merge-check.sh"
    - "scripts/recheck-evidence.js"
    - "lib/evidence-core.js"
    - "lib/gap-probe.js"
  t3_paths:
    - "src/lib/export.ts"
    - "src/lib/mapStyle.ts"
signoff:
  required_for: [T2, T3]
  approvers: ["manh"]
  require_human_commit: true
dev_server:
  start: "npm run dev"
  url: "http://localhost:5173"
feature_loop:
  suite_keys: [executors.test.api, executors.test.e2e, executors.test.mcp]
