schema_version: 1
feature_slug: map-motion-clip
evals:
  # ── AC-1..AC-3: năm bất biến, ca vi phạm + ca biên + ca loop-track ──────────
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.motion_invariants
    expected: "exit 0; mỗi luật R/O/L/B/I có ≥1 ca vi phạm bị ném lỗi mang ĐÚNG tiền tố tên luật (toThrow(/^R:/) …)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.motion_invariants
    expected: "exit 0; script đúng biên (restAtSec = 0.72×durationSec; fps×durationSec = 288) KHÔNG bị ném lỗi — biên phải pass, không được từ chối oan"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.motion_invariants
    expected: "exit 0; pulse BẮT ĐẦU SAU restAtSec (from=4.5 > restAtSec=4.2) ĐƯỢC chấp nhận vì là loop-track — luật O chỉ ràng buộc điểm kết của track one-shot; trần thật của pulse là đuôi clip, nên from=5.999 đạt còn from=6 (=durationSec) bị TỪ CHỐI với tiền tố L:; và hai track one-shot cùng kind bị TỪ CHỐI với tiền tố O:"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-4: compiler an toàn trên TOÀN miền, không sinh clip đứng im ──────────
  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.compiler_domain_sweep
    expected: "exit 0; stdout có 'violations: 0' và dòng OK cuối; quét 3 preset × 4 kinh độ (gồm ±179.5) × zoom 0→22 bước 0.1"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-4
    executor: test
    cmd: config:executors.test.motion_compiler
    expected: "exit 0; ca biên có tên: pushIn clamp ở zoom 1/22 và drift ở zoom 0/22 — zoom 0 KHÔNG còn là ca clamp của pushIn mà là ca NÉM của chốt headroom fly-in, có test riêng; approach ở zoom 2/5/6 cộng biên 0.5 đạt và 0/0.4 ném; kinh độ ÂM sát antimeridian (-179.5 ở hai mức zoom, -179.99, -179.999) — hai ca +179.5 đã bị bỏ có chủ ý vì offset luôn TRỪ khỏi tâm nên chúng không thể fail dưới bất kỳ hiện thực nào; override fps/durationSec ngoài dải báo lỗi nêu tên trường"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-5: toán nội suy ─────────────────────────────────────────────────────
  - id: E6
    criterion: AC-5
    executor: test
    cmd: config:executors.test.motion_math
    expected: "exit 0; lerpAngle(359,1,0.5) ≈ 0 (cung ngắn, không quay ngược 358°); sliceRing null tại p≤0 và nguyên vòng tại p≥1; ease lấy theo keyframe ĐÍCH của đoạn"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-6: tất định + số khung (browser thật) ───────────────────────────────
  - id: E7
    criterion: AC-6
    executor: test
    cmd: config:executors.test.mcp
    expected: "exit 0; renderClipFrames chạy 2 lần cùng config → mọi khung Buffer.equals true; số khung = round(fps×durationSec)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-7 + AC-10: hợp đồng REST, thành công và từ chối ─────────────────────
  - id: E8
    criterion: AC-7
    executor: test
    cmd: config:executors.test.clip_http
    expected: "exit 0; 200 trả đủ khối clip(mp4)+settle(png)+motion.restAtSec+resolved"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E9
    criterion: AC-10
    executor: test
    cmd: config:executors.test.clip_http
    expected: "exit 0; 422 cho preset lạ / thiếu motion / vỡ bất biến, body.error giữ NGUYÊN VĂN tiền tố luật (/^R:/); script vỡ schema trả chuỗi đọc được, KHÔNG phải ZodError thô; lỗi không-resolve-được trả 4xx chứ không phải 200"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-8: ép chrome clean trên CẢ HAI bề mặt (should-NOT-honor) ────────────
  - id: E10
    criterion: AC-8
    executor: test
    cmd: config:executors.test.clip_http
    expected: "exit 0; caller gửi chrome:'poster' nhưng config thực sự đưa xuống deps.renderClip có chrome === 'clean' (assert trên config bị bắt trong mock, không phải trên request)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E11
    criterion: AC-8
    executor: test
    cmd: config:executors.test.clip_tools
    expected: "exit 0; cùng bất biến trên bề mặt MCP render_clip — chrome bị ép 'clean' bất kể caller gửi gì"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-9: clip không chữ, một ngoại lệ (T3 — file này là t3_paths) ─────────
  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.text_free
    expected: "exit 0; với chrome:'clean' chữ DUY NHẤT vẽ lên canvas là dòng attribution (mọi fillText/strokeText khác làm đỏ); buildMapStyle phát 0 symbol layer khi roadLabels off và đúng ['road-label-major'] khi on"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-11: encoder hỏng → degrade, không sập, không rò file (should-NOT-crash)
  - id: E13
    criterion: AC-11
    executor: test
    cmd: config:executors.test.clip_http
    expected: "exit 0; encoder ghi file rồi ném lỗi → 200 {ok:true} KHÔNG có khoá clip, có settle + clipError, và file mp4 tạm KHÔNG còn trên đĩa sau đó"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E14
    criterion: AC-11
    executor: test
    cmd: config:executors.test.clip_tools
    expected: "exit 0; MCP render_clip cùng đường degrade — trả ok kèm clipError, giữ settle, dọn file; còn lỗi CHỤP KHUNG (renderClip ném) vẫn là error result, degrade không nới rộng"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-12: hạn mức đồng thời ───────────────────────────────────────────────
  - id: E15
    criterion: AC-12
    executor: test
    cmd: config:executors.test.clip_backpressure
    expected: "exit 0; nửa 429 — clip thứ hai khi đã chạm MAPPOSTER_CLIP_CONCURRENCY=1 trả 429 chứ không xếp hàng vô hạn (http.test.ts); nửa deadline — pool.acquire có acquireTimeoutMs nên waiter bị xếp hàng bị TỪ CHỐI bằng PoolAcquireTimeoutError và slot của nó được nhả, thay vì treo /render thường sau lưng clip (browserPool.test.ts), kèm nửa suppression: KHÔNG cấu hình acquireTimeoutMs thì waiter không bao giờ bị hết giờ"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ── AC-13, AC-14: judgment — T3 nên BẮT BUỘC verdict trực tiếp của người ───
  - id: E16
    criterion: AC-13
    executor: judgment
    question: >-
      Xem clip preset `approach` render cho một quận Việt Nam. Nó có đọc ra được BA NHỊP CÓ NGHĨA
      không — (1) mở đầu ở khung rộng thấy được bối cảnh thành phố, (2) ranh giới quận được vẽ dần
      chứ không hiện đột ngột, (3) đuôi clip đứng yên hoàn toàn — hay nó chỉ là một đoạn trôi vô
      hướng? Câu hỏi gốc mà gói này sinh ra để trả lời là "frame này có nghĩa gì?".
    inputs: [contract.md, evidence/E16-clip.mp4, evidence/E16-step1.png, evidence/E16-step2.png, evidence/E16-step3.png]
    evidence_required: [judged_by, verdict, rationale]
    # VERIFY phải SINH RA artefact trước khi hỏi: gọi /render-clip thật với
    # {preset:"approach"} cho một quận VN, lưu mp4 + 3 khung (đầu / giữa reveal /
    # đuôi nghỉ) vào evidence/. Không có clip thì người ký ở Gate 2 không có gì để nhìn.

  - id: E17
    criterion: AC-14
    executor: judgment
    question: >-
      Bất biến "clip không chữ" tồn tại để cổng chống-bịa (no-fab) phía tiêu thụ còn hiệu lực.
      Gói này mở MỘT ngoại lệ: dòng attribution giấy phép vẫn được nướng vào pixel. Ngoại lệ đó
      có được ghi tường minh (spec §2.3), có lý do chính đáng (nghĩa vụ giấy phép OSM), và có bị
      khoá đủ chặt để không chữ nào khác lọt vào pixel không? Hay nó là một lỗ hổng vừa được hợp
      thức hoá?
    inputs: [contract.md, docs/superpowers/specs/2026-08-03-map-motion-clip-design.md, src/lib/export.test.ts]
    evidence_required: [judged_by, verdict, rationale]
