schema_version: 1
feature_slug: mcp-map-render

evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; render_map('Ho Chi Minh City', format=tiktok) → PNG 1080×1920, center within ~0.05° of geocoded lng/lat"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; render_map(highlight.regions=['Quận 3, HCMC']) → resolved config has region FeatureCollection AND built style has highlight-outline/highlight-fill layers; a region resolved by name is anchored to the country of the location being rendered, including when location is {lng,lat}"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; render_map(highlight.points=['Võ Văn Tần, HCMC']) → marker at geocoded coord; auto zoom in [14,17]; camera override wins when set"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; mocked Nominatim: two identical geocodes ⇒ exactly 1 upstream call; a DIFFERENT query ⇒ 1 additional upstream call (should-not-fire pair); a transient failure is never memoized as a definitive answer"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; render_variants with 3 variant configs ⇒ array of 3 PNG results; a reused pooled page renders each config fresh (no stale frame); a variant cannot smuggle out-of-range coords/zoom/dims past the boundary guard"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; listTools over stdio AND over HTTP transport both return {render_map, render_variants, geocode_place, list_themes, list_formats}; the HTTP transport refuses a rebound Host and an unknown Origin; the static app server binds loopback by default; an oversized request body is refused with 413"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; default delivery ⇒ result has base64 AND path; file exists at configured sink dir; PNG decodes"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; list_formats includes tiktok=1080×1920; custom {width:1234,height:567} ⇒ PNG exactly 1234×567"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; chrome=clean ⇒ showText=false (no title overlay); chrome=poster ⇒ showText=true with city title; an unknown theme is refused rather than silently replaced by the default; resolved echoes theme + highlights"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E10
    criterion: AC-10
    executor: ui-check
    steps:
      - "Build web + start per config dev_server.start"
      - "Navigate render-mode with a resolved tiktok config → screenshot evidence/E10-step1.png (no onboarding modal visible)"
      - "await window.__mapposter.ready, then window.__mapposter.renderFrame() → screenshot evidence/E10-step2.png"
      - "Assert returned PNG dimensions == 1080×1920 → screenshot evidence/E10-step3.png"
    cmd: config:executors.test.e2e
    expected: "exit 0; render-mode headless: no onboarding, ready resolves, renderFrame() PNG is exactly 1080×1920; frames show config-load → render → dims"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; render_map(location='zzzzz-not-a-place') ⇒ structured error object (ok:false + message), no throw, no zero-byte PNG"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E12
    criterion: AC-12
    executor: judgment
    question: "For location 'Võ Văn Tần, Quận 3, HCMC', format tiktok, theme midnight-blue, point highlight — is the rendered image usable as video B-roll: location correctly centered, highlight legible, tiles/roads rendered without breakage?"
    inputs: [contract.md, evidence/E12-example.png]
    evidence_required: [judged_by, verdict, rationale]
